<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETEF - Ethiopian Transport Employers Federation</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    
    <button id="globalBackToTop" aria-label="Back to Top" title="Back to Top" class="back-to-top-btn" style="position: fixed; bottom: 2rem; right: 2rem; width: 3.5rem; height: 3.5rem; background-color: #1d64d6; color: white; border-radius: 9999px; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; visibility: hidden; transform: translateY(1rem); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999; border: none;">
      <svg style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
    </button>
    <script>
      const backToTopBtn = document.getElementById("globalBackToTop");
      window.addEventListener("scroll", () => {
        if (window.scrollY > 400) {
          backToTopBtn.style.opacity = "1";
          backToTopBtn.style.visibility = "visible";
          backToTopBtn.style.transform = "translateY(0)";
        } else {
          backToTopBtn.style.opacity = "0";
          backToTopBtn.style.visibility = "hidden";
          backToTopBtn.style.transform = "translateY(1rem)";
        }
      });
      backToTopBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      backToTopBtn.addEventListener("mouseenter", () => {
        backToTopBtn.style.backgroundColor = "#1e40af";
        backToTopBtn.style.transform = "translateY(-0.25rem)";
      });
      backToTopBtn.addEventListener("mouseleave", () => {
        backToTopBtn.style.backgroundColor = "#1d64d6";
        backToTopBtn.style.transform = "translateY(0)";
      });
    </script>
    
    <!-- Lenis Smooth Scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          direction: 'vertical',
          gestureDirection: 'vertical',
          smooth: true,
          mouseMultiplier: 1,
          smoothTouch: false,
          touchMultiplier: 2,
          infinite: false,
        });

        window.lenis = lenis;

        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }

        requestAnimationFrame(raf);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
